<!doctype html>
<html><head><meta charset="utf-8"><title>doodle-studio renderer</title>
<style>
  html,body{margin:0;padding:0;background:#fff;overflow:hidden}
  #stage{position:relative;overflow:hidden;background:#fff}
  .scene{position:absolute;inset:0;overflow:hidden;background-size:cover;background-position:center}
  .cam{position:absolute;inset:0;transform-origin:50% 50%}
  .el{position:absolute}
  .el svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  .el .fill{opacity:0}
  .el .strokes path{fill:none;stroke-linecap:round;stroke-linejoin:round}
  .el .text{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;white-space:pre;line-height:1.35}
  .el .text .line{display:inline-block;max-width:100%}
  .el img.photo{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
  #hand{position:absolute;left:0;top:0;z-index:1000;pointer-events:none;transform-origin:0 0;will-change:transform;opacity:0}
</style></head>
<body><div id="stage"></div><img id="hand" alt=""><script src="strokes-core.js"></script><script src="engine.js"></script></body></html>
